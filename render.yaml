services:
  - type: web
    name: wisehouse-internationalschool
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 'school_system:create_app()'
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE
        value: /var/data/school.sqlite3
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: SITE_URL
        value: https://wisehouse-internationalschool.onrender.com
    disk:
      name: school-portal-data
      mountPath: /var/data
      sizeGB: 1
