services:
  - type: web
    name: wisehouse-internationalschool
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 'school_system:create_app()'
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SQLALCHEMY_DATABASE_URI
        fromDatabase:
          name: wisehouse-school-db
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: SITE_URL
        value: https://wisehouse-internationalschool.onrender.com
    disk:
      name: school-portal-data
      mountPath: /var/data
      sizeGB: 1
databases:
  - name: wisehouse-school-db
    databaseName: wisehouse_school
    user: wisehouse_school
    plan: basic-256mb
    region: oregon
